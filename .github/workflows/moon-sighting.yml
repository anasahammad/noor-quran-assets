# Moon sighting: keeps config/remote.json "monthStarts" in step with Bangladesh's National Moon
# Sighting Committee. Every run (not only on the 29th) checks the previous, current and next
# Hijri month by the app's own calendar; a month whose sighting evening has come and that is not
# in monthStarts is resolved from the IFB notice (alone) or two agreeing news publishers, for up
# to 5 days after the evening. Anything else ends in an issue, never silently.
# The script lives in this repo (scripts/moon-sighting) and imports the app's calendar code from
# a sparse checkout of the app repo, so the Action and the app always agree.
name: Moon sighting

on:
  schedule:
    # GitHub cron is UTC and often runs late, so several runs per evening: 20:30, 21:30 and
    # 23:30 Dhaka (UTC+6), plus 09:00 the next morning to catch up. Days without a due month
    # finish in seconds without fetching anything.
    - cron: '30 14,15,17 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read the sources and print what would happen, but commit nothing and open no issue. Untick only for a real run.'
        type: boolean
        default: true
      now:
        description: 'Optional test time, ISO 8601 with an offset, e.g. 2026-11-10T20:00:00+06:00 (8 pm Dhaka) or 2026-11-10T14:00:00Z. Leave empty for the real current time. Anything else fails the run.'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: moon-sighting
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      # The app repo is read with a read-only SSH deploy key (no personal token).
      - name: Require the app repo deploy key
        env:
          APP_REPO_DEPLOY_KEY: ${{ secrets.APP_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$APP_REPO_DEPLOY_KEY" ]; then
            echo "::error title=Missing secret APP_REPO_DEPLOY_KEY::Add the private key of the read-only deploy key on anasahammad/noor-al-quran as the Actions secret APP_REPO_DEPLOY_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Check out the app (the calendar code the app runs)
        uses: actions/checkout@v7
        with:
          repository: anasahammad/noor-al-quran
          ssh-key: ${{ secrets.APP_REPO_DEPLOY_KEY }}
          ref: main
          path: app
          sparse-checkout: |
            src/lib/hijri
            src/config/countries

      # The same Node as the app repo (its .nvmrc; a root file, so the sparse checkout has it).
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc

      # The offline tests (fixtures only, no network, no keys) guard every run.
      - name: Run the tests
        run: npm test

      - name: Check the sighting evenings
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variable; empty = the script's default (gemini-flash-latest).
          # The run checks it exists first and reports a missing model in an issue.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # islamicfoundation.gov.bd does not send its intermediate certificate.
          NODE_EXTRA_CA_CERTS: scripts/moon-sighting/certs/sectigo-dv-r36.pem
          DRY_RUN: ${{ inputs.dry_run }}
          NOW: ${{ inputs.now }}
        run: |
          args=(--remote config/remote.json)
          if [ -f config/moon-sighting-sources.json ]; then args+=(--sources config/moon-sighting-sources.json); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # Spaces from pasting are trimmed; the script validates the rest and fails on anything
          # that is not an ISO date-time with an offset (it never falls back to another date).
          now_trimmed="${NOW#"${NOW%%[![:space:]]*}"}"
          now_trimmed="${now_trimmed%"${now_trimmed##*[![:space:]]}"}"
          if [ -n "$now_trimmed" ]; then args+=(--now "$now_trimmed"); fi
          echo "Run: dry_run=${DRY_RUN:-false}, now=${now_trimmed:-<current time>}"
          # Node runs the app's .ts files as ES modules; the flag hides its notice about the
          # app's package.json having no "type" (which stays unchanged).
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/moon-sighting/check.ts "${args[@]}"

      - name: Commit the month starts and purge jsDelivr
        if: steps.check.outputs.action == 'commit' && inputs.dry_run != true
        env:
          TITLE: ${{ steps.check.outputs.commit_title }}
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/remote.json', 'utf8'))"
          # Only config/remote.json may change (app/ is the app checkout, untracked).
          test "$(git status --porcelain | grep -v ' config/remote.json$' | grep -v ' app/$' | wc -l)" = "0"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/remote.json
          git commit -m "$TITLE"
          git push
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/config/remote.json"

      # One issue per title. "update": created, or commented on (and reopened) by every later run
      # that still has no decision. "once": created only if no issue has that title yet.
      - name: Open or update issues
        if: steps.check.outputs.issues_file != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES_FILE: ${{ steps.check.outputs.issues_file }}
        run: |
          count=$(jq length "$ISSUES_FILE")
          for i in $(seq 0 $((count - 1))); do
            export TITLE="$(jq -r ".[$i].title" "$ISSUES_FILE")"
            mode="$(jq -r ".[$i].mode" "$ISSUES_FILE")"
            body="$RUNNER_TEMP/moon-sighting-issue-$i.md"
            jq -r ".[$i].body" "$ISSUES_FILE" > "$body"
            # Exact title match in jq (titles contain quotes and parentheses, which the search
            # syntax would need escaping for); this repo has few issues.
            found=$(gh issue list --state all --limit 1000 --json number,state,title \
              --jq 'map(select(.title == env.TITLE)) | first | if . == null then "" else "\(.number) \(.state)" end')
            if [ -z "$found" ]; then
              gh issue create --title "$TITLE" --body-file "$body"
            elif [ "$mode" = "update" ]; then
              read -r number state <<< "$found"
              if [ "$state" = "CLOSED" ]; then gh issue reopen "$number"; fi
              gh issue comment "$number" --body-file "$body"
            else
              echo "Issue already exists: $TITLE"
            fi
          done
