# Every evening 18:30–23:30 Dhaka: is this the 29th of a Hijri month (by the app's own calendar)?
# Then read the National Moon Sighting Committee's decision and, if it differs from the
# calculation, update config/remote.json "monthStarts" (only with two agreeing sources) or open
# an issue. The script lives in this repo (scripts/moon-sighting) and imports the app's calendar
# code from a sparse checkout of the app repo, so the Action and the app always agree.
name: Moon sighting

on:
  schedule:
    # GitHub cron is UTC: 12:30–17:30 UTC = 18:30–23:30 in Dhaka (UTC+6), every hour.
    - cron: '30 12-17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read the sources and print what would happen, but commit nothing and open no issue. Untick only for a real run.'
        type: boolean
        default: true
      now:
        description: 'Optional test time, ISO 8601 with an offset, e.g. 2026-11-10T20:00:00+06:00 (8 pm Dhaka) or 2026-11-10T14:00:00Z. Leave empty for the real current time. Anything else fails the run.'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: moon-sighting
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      # The app repo is read with a read-only SSH deploy key (no personal token).
      - name: Require the app repo deploy key
        env:
          APP_REPO_DEPLOY_KEY: ${{ secrets.APP_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$APP_REPO_DEPLOY_KEY" ]; then
            echo "::error title=Missing secret APP_REPO_DEPLOY_KEY::Add the private key of the read-only deploy key on anasahammad/noor-al-quran as the Actions secret APP_REPO_DEPLOY_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Check out the app (the calendar code the app runs)
        uses: actions/checkout@v7
        with:
          repository: anasahammad/noor-al-quran
          ssh-key: ${{ secrets.APP_REPO_DEPLOY_KEY }}
          ref: main
          path: app
          sparse-checkout: |
            src/lib/hijri
            src/config/countries

      # The same Node as the app repo (its .nvmrc; a root file, so the sparse checkout has it).
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc

      # The offline tests (fixtures only, no network, no keys) guard every run.
      - name: Run the tests
        run: npm test

      - name: Check this evening's decision
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # islamicfoundation.gov.bd does not send its intermediate certificate.
          NODE_EXTRA_CA_CERTS: scripts/moon-sighting/certs/sectigo-dv-r36.pem
          DRY_RUN: ${{ inputs.dry_run }}
          NOW: ${{ inputs.now }}
        run: |
          args=(--remote config/remote.json)
          if [ -f config/moon-sighting-sources.json ]; then args+=(--sources config/moon-sighting-sources.json); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # Spaces from pasting are trimmed; the script validates the rest and fails on anything
          # that is not an ISO date-time with an offset (it never falls back to another date).
          now_trimmed="${NOW#"${NOW%%[![:space:]]*}"}"
          now_trimmed="${now_trimmed%"${now_trimmed##*[![:space:]]}"}"
          if [ -n "$now_trimmed" ]; then args+=(--now "$now_trimmed"); fi
          echo "Run: dry_run=${DRY_RUN:-false}, now=${now_trimmed:-<current time>}"
          # Node runs the app's .ts files as ES modules; the flag hides its notice about the
          # app's package.json having no "type" (which stays unchanged).
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/moon-sighting/check.ts "${args[@]}"

      - name: Commit the new month start and purge jsDelivr
        if: steps.check.outputs.action == 'commit'
        env:
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/remote.json', 'utf8'))"
          # Only config/remote.json may change (app/ is the app checkout and moon-sighting-issue.md
          # the issue text; both are untracked and never committed).
          test "$(git status --porcelain | grep -v ' config/remote.json$' | grep -v ' app/$' | grep -v 'moon-sighting-issue.md' | wc -l)" = "0"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/remote.json
          git commit -m "$TITLE"
          git push
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/config/remote.json"

      - name: Open an issue (once per title)
        if: steps.check.outputs.action == 'commit' || steps.check.outputs.action == 'issue'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
          BODY_FILE: ${{ steps.check.outputs.body_file }}
        run: |
          existing=$(gh issue list --state all --search "in:title \"$TITLE\"" --json title --jq "map(select(.title == env.TITLE)) | length")
          if [ "$existing" = "0" ]; then
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          else
            echo "An issue with this title already exists."
          fi
